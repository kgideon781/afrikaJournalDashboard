server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API prefixes are proxied to the Django container.
    # Client sees them as same-origin so mobile Chrome's HTTPS-upgrade
    # cannot silently upgrade the fetch to a nonexistent https://:8000.
    location /api/         { proxy_pass http://10.176.203.209:8000; }
    location /journal_api/ { proxy_pass http://10.176.203.209:8000; }
    location /authApi/     { proxy_pass http://10.176.203.209:8000; }
    location /admin/       { proxy_pass http://10.176.203.209:8000; }
    location /static/      { proxy_pass http://10.176.203.209:8000; }
    location /media/       { proxy_pass http://10.176.203.209:8000; }

    # Common proxy headers so Django sees the real client + host.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # SPA fallback: any path not matched above and not a real file goes to
    # index.html so react-router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
