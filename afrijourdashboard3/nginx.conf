server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression --------------------------------------------------
    # Vite ships uncompressed JS/CSS; gzip cuts payload ~3-4x on the wire.
    # Skip already-compressed types (images, fonts, PDFs).
    gzip                on;
    gzip_vary           on;
    gzip_min_length     1024;
    gzip_comp_level     6;
    gzip_proxied        any;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/x-javascript
        text/css
        text/plain
        text/javascript
        text/xml
        image/svg+xml;

    # Bulk upload sends a spreadsheet + up to 200 PDFs — raise the request-body
    # cap from the 1 MB nginx default so the multipart form isn't truncated.
    client_max_body_size 250m;
    client_body_timeout 300s;
    proxy_request_buffering off;

    # Backend API prefixes are proxied to the Django container.
    # Client sees them as same-origin so mobile Chrome's HTTPS-upgrade
    # cannot silently upgrade the fetch to a nonexistent https://:8000.
    location /api/         { proxy_pass http://10.176.203.209:8000; }
    location /journal_api/ { proxy_pass http://10.176.203.209:8000; }
    location /authApi/     { proxy_pass http://10.176.203.209:8000; }
    location /admin/       { proxy_pass http://10.176.203.209:8000; }
    location /static/      { proxy_pass http://10.176.203.209:8000; }
    location /media/       { proxy_pass http://10.176.203.209:8000; }

    # Common proxy headers so Django sees the real client + host.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # SPA fallback: any path not matched above and not a real file goes to
    # index.html so react-router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
